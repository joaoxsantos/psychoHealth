services:
  - type: web
    name: psychohealth-api
    runtime: node
    plan: free
    rootDir: PsychoHealth_TCC
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PSYCHOHEALTH_DATA_DIR
        value: /opt/render/project/src/backend/data
